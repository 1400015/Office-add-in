name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build

      - run: npm run validate
      - run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('manifest.xml'); print('manifest.xml OK')"
      - run: npx office-addin-manifest info manifest.xml

      # The proxy deploys from its own entry point (wrangler.toml), which the
      # app build never touches. Keep it bundling on every push.
      - name: Bundle the proxy worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist-proxy
