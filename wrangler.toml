name = "ouai-proxy"
main = "proxy/worker.ts"
compatibility_date = "2026-10-01"

# `wrangler deploy` is production. It refuses every request until
# ALLOWED_ORIGINS is the origin that hosts the add-in:
#   npx wrangler deploy --var ALLOWED_ORIGINS:"https://meu-servidor.com"
# Local worker testing stays open only to the taskpane dev server:
#   npx wrangler dev --env dev
[vars]
ENVIRONMENT = "production"

[env.dev]
name = "ouai-proxy-dev"

[env.dev.vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "https://localhost:3000"
